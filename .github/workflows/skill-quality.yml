name: Skill Quality Score

on:
  push:
    branches: [main]
    paths: ['skills/**', 'validation/**']
  pull_request:
    paths: ['skills/**', 'validation/**']

jobs:
  lint:
    name: SKILL Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run skill-lint.py
        run: |
          python3 validation/skill-lint.py --json > lint-report.json || true
          cat lint-report.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Lint: {d[\"passed\"]}/{d[\"total_skills\"]} passed, {d[\"total_errors\"]} errors, {d[\"total_warnings\"]} warnings')
          "
          # Fail on errors
          python3 -c "
          import json
          d = json.load(open('lint-report.json'))
          if d['total_errors'] > 0:
              print(f'::error::{d[\"total_errors\"]} lint errors found')
              sys.exit(1)
          "

      - name: Run validate-payloads.py
        run: |
          python3 validation/validate-payloads.py --json > payloads-report.json || true
          cat payloads-report.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          existing = sum(1 for r in d if r['exists'])
          print(f'Payloads: {existing}/{len(d)} existing')
          "

      - name: Run validate-testcases.py
        run: |
          python3 validation/validate-testcases.py --json > testcases-report.json || true
          cat testcases-report.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          existing = sum(1 for r in d if r['exists'])
          total_tcs = sum(r['stats'].get('test_cases', 0) for r in d)
          print(f'Test cases: {existing}/{len(d)} files, {total_tcs} total TCs')
          "

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            lint-report.json
            payloads-report.json
            testcases-report.json

  score:
    name: Quality Score (SCORE.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run SCORE.sh
        run: bash validation/SCORE.sh

      - name: Run batch-improve.sh
        run: bash validation/batch-improve.sh --top 5

      - name: Check for regressions
        run: |
          WEAK_COUNT=$(find validation/evidence/quality-scores -name "*.json" -exec jq -r '.tier' {} \; | grep -c "Weak" || true)
          if [ "$WEAK_COUNT" -gt 0 ]; then
            echo "::error::$WEAK_COUNT skills regressed to Weak tier"
            exit 1
          fi

      - name: Quality gate - block PR on score regression
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Quality Gate: Score Regression Check ==="
          BASELINE_AVG=87.5
          CURRENT_AVG=$(find validation/evidence/quality-scores -name "*.json" -exec jq -r '.overall_score' {} \; | awk '{sum+=$1; n++} END {printf "%.1f", sum/n}')
          echo "Baseline average: $BASELINE_AVG"
          echo "Current average: $CURRENT_AVG"

          REGRESSED=$(awk "BEGIN {print ($CURRENT_AVG < $BASELINE_AVG - 1.0)}")
          if [ "$REGRESSED" = "1" ]; then
            echo "::error::Average score dropped from $BASELINE_AVG to $CURRENT_AVG (threshold: -1.0)"
            exit 1
          fi

          echo "Quality gate PASSED: avg=$CURRENT_AVG (baseline=$BASELINE_AVG)"

      - name: Upload score evidence
        uses: actions/upload-artifact@v4
        with:
          name: quality-scores
          path: validation/evidence/quality-scores/
